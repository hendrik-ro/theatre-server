services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theatre
    # Postgres 18+ stores data in version-specific subdirectories and
    # rejects mounts at the old /var/lib/postgresql/data path; mount the
    # parent instead (docker-library/postgres PR #1259).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theatre"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Reuses the repo .env for secrets; environment below overrides
    # DB_URL and NODE_ENV to route at the db service.
    env_file: .env
    environment:
      NODE_ENV: production
      DB_URL: postgres://postgres:postgres@db:5432/theatre
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
